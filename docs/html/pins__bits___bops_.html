      <h1>Pins (Bits & Bops)</h1>
      <div>Pins are achievements in Bits & Bops, which are earned by completing various tasks, progressing through the game, or interacting with items around the store. There are sixteen pins in the game. Pins come in through the mail.<<tablePin|Requirement||Explorer|Complete the Jungle Mixtape||Aviator|Complete the Sky Mixtape||Diver|Complete the Ocean Mixtape||Firefighter|Complete the Fire Mixtape||Maestro|Follow the metronome perfectly in Conductor||Marathoner|Do a lap of the city (~500 steps) in Three-Legged Race||Smithy|Forge all 8 unique items in Blacksmith||Bravo!|Applaud all 8 performances in Encore||Timekeeper|Reach 60 seconds in the cuckoo clock||Completely Cool|Get Cool or better on all minigames and mixtapes||Altogether Amazing|Get Amazing or better on all minigames and mixtapes||Purely Perfect|Get Perfect or better on all minigames and mixtapes||Get Help|Repeatedly ring the bell at the front counter||Scratch the Itch|Repeatedly swap records with the tonearm down||Technical Difficulties|On the computer, disable the firewall or format the disk||Troublemaker|Get the snarky text on a minigame by disobeying the rulestable>></div>
